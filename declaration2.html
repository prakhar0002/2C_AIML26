<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Eligibility</title>

    <script>
        function info() {

            let age = parseInt(prompt("Enter value of age"));
            if(age>=18){ let c = confirm("do you want to submit your vote");
            if(c){
                alert("your Response submitted");
            }
            else{
                alert("not submitted;Thank you");
            }
        }}

            
    </script>
</head>

<body>
    <input type="button" onclick="info()" value="Result">
</body>
</html>
